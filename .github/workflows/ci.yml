name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check all hook scripts
        run: |
          for f in plugins/*/hooks/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Syntax-check shell scripts
        run: |
          bash -n scripts/*.sh
          for f in plugins/*/skills/*/assets/pre-push; do
            [ -e "$f" ] || continue
            echo "sh -n $f"
            sh -n "$f"
          done

      - name: Validate skill assets
        run: |
          for y in plugins/*/skills/*/assets/*.yml; do
            [ -e "$y" ] || continue
            echo "parse $y"
            python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$y"
          done
          for j in plugins/*/skills/*/*.json; do
            [ -e "$j" ] || continue
            echo "parse $j"
            node -e "JSON.parse(require('fs').readFileSync('$j','utf8'))"
          done

      - name: Assert repo-standards keeps an admin bypass actor
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync(
              "plugins/aaron-intelligence/skills/repo-standards/standard.json", "utf8"));
            const ok = (s.bypass_actors || []).some(a =>
              a.actor_type === "RepositoryRole" && a.bypass_mode === "always");
            if (!ok) {
              console.error(
                "standard.json has no always-bypass RepositoryRole actor: with a required\n" +
                "approval a sole maintainer would be permanently unable to merge.");
              process.exit(1);
            }
            const pr = (s.rules || []).find(r => r.type === "pull_request");
            if (!pr || pr.parameters.require_code_owner_review !== true) {
              console.error("standard.json must require code-owner review");
              process.exit(1);
            }
            console.log("repo-standards invariants hold");
          '

      - name: Validate JSON manifests
        run: |
          for j in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json; do
            echo "parse $j"
            node -e "JSON.parse(require('fs').readFileSync('$j','utf8'))"
          done

      - name: Assert marketplace source paths exist
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"));
            const plugins = m.plugins || [];
            let bad = 0;
            for (const p of plugins) {
              const src = typeof p.source === "string" ? p.source : (p.source && p.source.path);
              if (!src) { console.error("plugin missing source:", p.name); bad++; continue; }
              const rel = src.replace(/^\.?\//, "");
              if (!fs.existsSync(rel)) { console.error("source path missing:", rel); bad++; }
            }
            if (bad) process.exit(1);
            console.log("all", plugins.length, "plugin source paths exist");
          '

      - name: Run bash-tool-guard tests
        run: node --test plugins/aaron-intelligence/hooks/bash-tool-guard.test.js
